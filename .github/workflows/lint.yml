name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.77.0
          environments: lint
          locked: true
          cache: true
      - run: pixi run --locked --environment lint lint
      - run: pixi run --locked --environment lint format-check
