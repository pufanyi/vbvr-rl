[project]
name = "wan-trainer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "decord2==3.4.0",
    "diffusers[torch]>=0.37.1",
    "easydict>=1.13",
    "ffmpeg-binaries-compat==1.1.0",
    "ftfy>=6.3.1",
    # VBVR main_v2 scorer runtime. Keep these exact pins synchronized with
    # src/eval/vbvr_runtime.py and the known-good pre-resume W&B snapshot.
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "numpy==2.4.4",
    "peft>=0.18.1",
    "pydantic>=2.0",
    "regex>=2026.3.32",
    "torch==2.11.0",
    "torchdata>=0.11.0",
    "torchvision==0.26.0",
    "transformers>=5.5.4",
    "wandb>=0.25.1",
    "rich>=14.0",
    "loguru>=0.7",
    "liger-kernel>=0.7.0",
    "pyarrow>=19.0",
    "safetensors>=0.7.0",
    "webdataset>=1.0.2",
    "datasets>=4.8.4",
    # EasyOCR also depends on opencv-python-headless. Keep both distributions
    # on the same release so their shared cv2 package cannot be overwritten by
    # an incompatible major version.
    "opencv-python==4.13.0.92",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.2.0",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "tifffile==2026.3.3",
    "openpyxl>=3.1.5",
    "easyocr==1.7.2",
    "norfair==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.11",
]

[tool.uv]
# Norfair 2.3 still declares numpy<2 even though the pinned VBVR evaluator is
# exercised with the project's NumPy 2 stack. Keep the runtime constraint
# explicit so the evaluator dependencies can be resolved reproducibly.
override-dependencies = [
    "numpy==2.4.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "aoss",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["wan_trainer"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
