[project]
name = "vbvr-rl"
version = "0.1.0"
description = "Distributed Wan2.2 training and reinforcement learning for VBVR-Pro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Pu Fanyi", email = "FPU001@e.ntu.edu.sg" },
]
license = "MIT"
dependencies = [
    "decord2==3.4.0",
    "diffusers[torch]>=0.37.1",
    "easydict>=1.13",
    "ffmpeg-binaries-compat==1.1.0",
    "ftfy>=6.3.1",
    # VBVR main_v2 scorer runtime. Keep these exact pins synchronized with
    # src/eval/vbvr_runtime.py and the documented evaluator contract.
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "numpy==2.4.4",
    "peft>=0.18.1",
    "pydantic>=2.0",
    "regex>=2026.3.32",
    "torch==2.11.0",
    "torchdata>=0.11.0",
    "torchvision==0.26.0",
    # Transformers 5.14.1 is the first project-tested release compatible with
    # kernels 0.16's versioned LayerRepository API.
    "transformers>=5.14.1",
    "wandb>=0.25.1",
    "rich>=14.0",
    "loguru>=0.7",
    "liger-kernel>=0.8.1",
    # Diffusers FlashAttention-3 Hub backend. Keep this exact: 0.16 adds the
    # stable-ABI cu126 resolver needed by the official torch 2.11 wheel.
    "kernels==0.16.0",
    "pyarrow>=19.0",
    "safetensors>=0.7.0",
    "webdataset>=1.0.2",
    "datasets>=4.8.4",
    # EasyOCR also depends on opencv-python-headless. Keep both distributions
    # on the same release so their shared cv2 package cannot be overwritten by
    # an incompatible major version.
    "opencv-python==4.13.0.92",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.2.0",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
    "tifffile==2026.3.3",
    "openpyxl>=3.1.5",
    "easyocr==1.7.2",
    "norfair==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.16.3",
]

[project.urls]
Repository = "https://github.com/pufanyi/vbvr-rl"
Documentation = "https://github.com/pufanyi/vbvr-rl/tree/main/docs"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.6" }]
requires-pixi = ">=0.77.0,<0.78"

[tool.pixi.dependencies]
fish = ">=4.0,<5"

[tool.pixi.pypi-options.dependency-overrides]
# Norfair 2.3 still declares numpy<2 even though the pinned VBVR evaluator is
# exercised with the project's NumPy 2 stack. Keep the runtime constraint
# explicit so the evaluator dependencies can be resolved reproducibly.
numpy = "==2.4.4"
# Keep the training stack on the official PyTorch CUDA 12.6 wheels.
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.tasks]
test = "python -m pytest tests"
check = { depends-on = ["lint", "format-check", "test"] }
runtime-check = "python -m src.eval.vbvr_runtime"
setup-vllm = "fish scripts/dev/setup_host_vllm.fish"
download-vllm-model = "fish scripts/download/qwen36_27b_hf_mirror.fish"
serve-vllm = "fish scripts/serve/qwen36_27b_vllm.fish"

[tool.pixi.feature.lint.dependencies]
python = "3.12.*"

[tool.pixi.feature.lint.pypi-dependencies]
ruff = "==0.16.3"

[tool.pixi.feature.lint.tasks]
lint = "ruff check --output-format=github ."
format-check = "ruff format --check ."

[tool.pixi.feature.vllm.dependencies]
python = "3.12.*"

[tool.pixi.feature.vllm.pypi-dependencies]
numpy = "==2.3.5"
ray = { version = "*", extras = ["cgraph"] }
vllm = "==0.26.0"

[tool.pixi.feature.vllm.pypi-options.dependency-overrides]
# vLLM 0.26.0's media extras are paired with the Torch 2.11 release family;
# force every member of that family to the official CUDA 12.6 wheel index.
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu126" }
torchaudio = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = "==0.26.0", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true }
vllm = { features = ["vllm"], no-default-feature = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/trainer/rewards/vbvr_vlm_eval_prompts.py" = ["E501"]

[tool.ruff.format]
exclude = ["src/trainer/rewards/vbvr_vlm_eval_prompts.py"]
