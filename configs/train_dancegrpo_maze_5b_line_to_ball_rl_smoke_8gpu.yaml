trainer: dancegrpo
model_path: storage/models/Wan2.2-TI2V-5B-Diffusers

latent_webdataset_dir: storage/latents/maze_5b_line_to_ball_v1/webdataset/rl
dataset_size: 8

output_dir: storage/checkpoints/dancegrpo_maze_5b_line_to_ball_rl_smoke_8gpu
resume_from: storage/checkpoints/cos_maze_5b_line_to_ball_100k_tau_0.9/checkpoint-epoch3
reset_dataloader: true
auto_resume: false

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 1
max_steps: 1
save_steps: 0
save_epoch_checkpoints: false
learning_rate: 1.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 0
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: bfloat16
gradient_checkpointing: true

num_workers: 0
prefetch_factor: 2
persistent_workers: false

fsdp: true
expert_parallel: false
hsdp: true
train_experts: both
lora_rank: 32
lora_alpha: 32

grpo_group_size: 2
grpo_sample_batch_size: 1
grpo_train_sample_batch_size: 1
grpo_num_sampling_steps: 4
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0.0
grpo_reward_fn: maze_tracker
grpo_sde_noise_scale: 0.3
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

maze_tracker_reward_num_frames: 3
maze_tracker_reward_search_radius: 96
maze_tracker_reward_color_slack: 28.0
maze_tracker_reward_goal_tolerance_cells: 1.0
maze_tracker_reward_max_mean_error_cells: 4.0
maze_tracker_reward_w_traj: 0.35
maze_tracker_reward_w_onpath: 0.25
maze_tracker_reward_w_goal: 0.25
maze_tracker_reward_w_progress: 0.15

wandb_project: null
