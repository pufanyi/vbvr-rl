trainer: i2v
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers
dataset_json: data/diffsynth_mix/260603_mix_vbvr_vr_view_i2v.json
output_dir: storage/checkpoints/sft_diffsynth_mix_260603_smoke

num_frames: 81
height: 384
width: 384
fps: 16
shuffle_raw_indices: true
shuffle_raw_indices_seed: 42
raw_remote_prefetch_lookahead: 1
raw_remote_prefetch_workers: 1

batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 1
max_steps: 3
learning_rate: 5.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 5
optimizer: adamw
save_steps: 4000
save_final_checkpoint: false
log_steps: 1
seed: 42

ema_decay: 0.0
prompt_dropout: 0.1
transformer_load_dtype: bfloat16
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.0

expert_parallel: true
expert_parallel_data_mode: split
train_experts: both

num_workers: 8
prefetch_factor: 4
persistent_workers: true

wandb_project: null
