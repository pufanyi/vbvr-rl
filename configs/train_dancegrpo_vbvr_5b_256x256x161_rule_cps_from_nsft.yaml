trainer: dancegrpo
model_path: storage/models/Wan2.2-TI2V-5B-Diffusers

# Latents generated with the 5B TI2V expand-timestep condition format.
latent_webdataset_dir: storage/latents/vbvr_5b_256x256x161_fullrun/webdataset/rl
dataset_size: 200000

output_dir: storage/checkpoints/dancegrpo_vbvr_5b_256x256x161_rule_cps_from_nsft
resume_from: storage/checkpoints/sft_vbvr_5b_256x256x161_full_lr_1e-5/checkpoint-epoch1
reset_dataloader: true
auto_resume: true

# All-rank GRPO path for grpo_multinode.fish: every GPU trains and rolls out.
# The prompt batch is shared globally and each prompt's G samples are sharded
# across ranks, so batch_size=8 means 8 prompts per optimizer step on 64 GPUs.
rl_train_node_count: 0
rl_train_rank_count: 0
rl_actor_weight_sync: none
rl_actor_weight_sync_interval: 1
rl_async_rollout: false
rl_async_rollout_prefetch_steps: 0
rl_split_debug_logs: false

batch_size: 8
gradient_accumulation_steps: 1
num_epochs: 5
learning_rate: 1.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 5
save_steps: 300
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: float32
gradient_checkpointing: true

num_workers: 1
prefetch_factor: 2
persistent_workers: true

# 5B TI2V is a dense single-transformer model; shard with FSDP/HSDP, no expert parallel.
fsdp: true
expert_parallel: false
hsdp: true
train_experts: both
lora_rank: 0
lora_alpha: 32

# Shared-prompt all-rank GRPO: with 64 GPUs and batch_size=8, each prompt gets
# 8 ranks; G=24 gives 3 rollouts per rank.
grpo_shared_prompt_batch: true
grpo_group_size: 32
grpo_sample_batch_size: 8
grpo_train_sample_batch_size: 4
grpo_num_sampling_steps: 30
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0
grpo_reward_fn: vbvr_rule
# Coefficients-Preserving Sampling (CPS) SDE transition formula.
grpo_sde_formula: flowcps
grpo_sde_noise_scale: 0.7
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

# VBVR EvalKit rule reward. This decodes generated/GT latents to temporary
# videos and scores with task_specific_only=True, matching run_evaluation.py.
vbvr_reward_device: cpu
vbvr_reward_fps: 16
vbvr_reward_decode_batch_size: 1
vbvr_reward_task_specific_only: true
vbvr_reward_tmp_dir: storage/tmp/vbvr_5b_rule_reward
vbvr_reward_keep_tmp: false
vbvr_reward_unsupported_score: 0.0

wandb_project: wan-dancegrpo-vbvr-5b
wandb_run_name: dancegrpo_vbvr_5b_256x256x161_rule_cps_from_nsft
