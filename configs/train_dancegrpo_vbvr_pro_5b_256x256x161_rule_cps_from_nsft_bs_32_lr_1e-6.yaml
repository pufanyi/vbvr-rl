trainer: dancegrpo
model_path: storage/models/Wan2.2-TI2V-5B-Diffusers

# Strict VBVR-Pro In-Domain training set: only official In-Domain_50 tasks,
# with every manifest bench ID removed from the train IDs.
# This is intentionally raw-data based: no latent_webdataset_dir is set, so
# DanceGRPO encodes the prompt/video/image batch online before rollout.
dataset_json: storage/datasets/VBVR-Pro-RL/materialized/dataset.json
dataset_size: 50000
shuffle_raw_indices: true
shuffle_raw_indices_seed: 42
num_frames: 161
height: 256
width: 256
fps: 16

output_dir: storage/checkpoints/dancegrpo_vbvr_pro_5b_256x256x161_rule_cps_from_nsft_bs32_lr_1e-6_indomain_strict
resume_from: storage/checkpoints/sft_vbvr_5b_256x256x161_full_lr_1e-5/checkpoint-epoch1
reset_dataloader: true
auto_resume: true

# All-rank GRPO path for grpo_multinode.fish: every GPU trains and rolls out.
# The prompt batch is shared globally and each prompt's G samples are sharded
# across ranks, so batch_size=32 means 32 prompts per optimizer step on 64 GPUs.
rl_train_node_count: 0
rl_train_rank_count: 0
rl_actor_weight_sync: none
rl_actor_weight_sync_interval: 1
rl_async_rollout: false
rl_async_rollout_prefetch_steps: 0
rl_split_debug_logs: false

batch_size: 32
gradient_accumulation_steps: 1
num_epochs: 5
learning_rate: 1.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 5
save_steps: 100
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: float32
gradient_checkpointing: true

num_workers: 2
prefetch_factor: 2
persistent_workers: true

# 5B TI2V is a dense single-transformer model; shard with FSDP/HSDP, no expert parallel.
fsdp: true
expert_parallel: false
hsdp: true
train_experts: both
lora_rank: 0
lora_alpha: 32

# Shared-prompt all-rank GRPO: with 64 GPUs and batch_size=32, each prompt gets
# 2 ranks; G=32 gives 16 rollouts per rank.
grpo_shared_prompt_batch: true
grpo_group_size: 32
grpo_sample_batch_size: 8
grpo_train_sample_batch_size: 4
grpo_num_sampling_steps: 30
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0
grpo_reward_fn: vbvr_rule
# Coefficients-Preserving Sampling (CPS) SDE transition formula.
grpo_sde_formula: flowcps
grpo_sde_noise_scale: 0.7
# Optional random mode: sample one coefficient per prompt/GRPO group while
# keeping all G rollouts inside that group identical.
grpo_cps_noise_scale_range: [0.0, 1.0]
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

# VBVR-Pro interleave EvalKit rule reward. Raw dataset metadata passes the
# original GT first/final/video paths through to the scorer.
vbvr_reward_evalkit_dir: storage/evalkits/vbvr-evalkit-interleave-main_v2
vbvr_reward_evalkit_source_sha256: f99edd06fd39b5025a0a46871fc7280f7353d47e8de45b627a0b0711318fd258
vbvr_reward_easyocr_module_path: storage/evalkits/easyocr-shared
vbvr_reward_device: cpu
vbvr_reward_fps: 16
vbvr_reward_decode_batch_size: 8
vbvr_reward_cpu_workers: 1
vbvr_reward_cpu_threads_per_worker: 16
vbvr_reward_use_process_pool: true
vbvr_reward_prepared_width: 1024
vbvr_reward_prepared_height: 1024
vbvr_reward_max_duration_seconds: 5.0
vbvr_reward_prepare_crf: 12
vbvr_reward_fail_on_error: true
vbvr_reward_task_specific_only: true
vbvr_reward_tmp_dir: storage/tmp/vbvr_pro_5b_rule_reward
vbvr_reward_keep_tmp: false
vbvr_reward_unsupported_score: 0.0

wandb_project: wan-dancegrpo-vbvr-pro-5b
wandb_run_name: dancegrpo_vbvr_pro_5b_256x256x161_rule_cps_from_nsft_bs32_lr_1e-6_indomain_strict
