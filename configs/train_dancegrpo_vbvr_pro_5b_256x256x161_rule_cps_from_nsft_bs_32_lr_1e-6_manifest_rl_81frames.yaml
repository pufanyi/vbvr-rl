trainer: dancegrpo
# DiffSynth step 35500 is a rank-32/alpha-32 LoRA. It is converted with the
# official Diffusers Wan key mapping, merged into the matching TI2V-5B base,
# and stored as a complete Hugging Face Diffusers pipeline.
model_path: storage/models/diffsynth_converted_5b/wan2.2-TI2V-5B_260715_vbvr_pro_step-35500

# Same training setting as the strict lr=1e-6 In-Domain run, but read the
# dedicated "rl" split from split_manifest_rl.json. The verified 2026-07-23
# manifest has 50 In-Domain tasks x 1,000 samples = 50,000 samples
# (SHA-256: 8eb86bf31b24dc5a21deb03a8294c15d299731db0f6f1ea0ddfcd3fd36619f32).
# This is intentionally raw-data based: DanceGRPO encodes prompt/video/image
# online before rollout.
dataset_json: storage/datasets/vbvr-pro-rl-indomain-50k/materialized/dataset.json
dataset_size: 50000
shuffle_raw_indices: true
shuffle_raw_indices_seed: 42
num_frames: 81
height: 256
width: 256
fps: 16

output_dir: storage/checkpoints/dancegrpo_vbvr_pro_5b_256x256x81_rule_cps0p7_from_diffsynth_step35500_bs32_lr_1e-6_manifest_rl_evalkit_6fedd9d9_reward1024_fps16
resume_from: null
reset_dataloader: true
auto_resume: true

# All-rank GRPO path for grpo_multinode.fish: every GPU trains and rolls out.
# The prompt batch is shared globally and each prompt's G samples are sharded
# across ranks, so batch_size=32 means 32 prompts per optimizer step on 64 GPUs.
rl_train_node_count: 0
rl_train_rank_count: 0
rl_actor_weight_sync: none
rl_actor_weight_sync_interval: 1
rl_async_rollout: false
rl_async_rollout_prefetch_steps: 0
rl_split_debug_logs: false

batch_size: 32
gradient_accumulation_steps: 1
num_epochs: 5
learning_rate: 1.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 5
save_steps: 100
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: float32
gradient_checkpointing: true

num_workers: 2
prefetch_factor: 2
persistent_workers: true

# 5B TI2V is a dense single-transformer model; shard with FSDP/HSDP, no expert parallel.
fsdp: true
expert_parallel: false
hsdp: true
train_experts: both
lora_rank: 0
lora_alpha: 32

# Shared-prompt all-rank GRPO keeps 32 prompts per optimizer step. Two
# 16-prompt waves are prepared before replay: later CPU rewards overlap earlier
# replay without crossing an optimizer update. On 64 GPUs each wave gives a
# prompt 4 ranks x 8 rollouts; on 32 GPUs it gives 2 ranks x 16 rollouts.
grpo_shared_prompt_batch: true
grpo_shared_prompt_microbatch_size: 16
# Cross-step pipeline: replay trajectories one policy update late so CPU reward
# work overlaps replay. This config enables it with the wider clip below;
# checkpoint and epoch boundaries drain the slot.
grpo_delayed_replay: true
grpo_delayed_replay_clip_range: 1.0e-2
grpo_group_size: 32
grpo_sample_batch_size: 8
grpo_train_sample_batch_size: 4
grpo_num_sampling_steps: 30
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0
grpo_reward_fn: vbvr_rule
# Coefficients-Preserving Sampling (CPS) SDE transition formula.
grpo_sde_formula: flowcps
# Keep one fixed coefficient for every prompt/group and optimizer step.
grpo_sde_noise_scale: 0.7
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

# Latest pinned GitHub main_v2 revision:
# 6fedd9d9edb8daafa56aca8e53885aa8ad6f6037. Its contract fingerprint covers
# the entrypoint, all vbvr_bench Python, task annotations, and requirements.
vbvr_reward_evalkit_dir: storage/evalkits/vbvr-evalkit-interleave-main_v2-6fedd9d9
vbvr_reward_evalkit_source_sha256: eb977da60e95456734063ba018b14d805680179fdf0e3e3b2ba6f603f27a935c
vbvr_reward_easyocr_module_path: storage/evalkits/easyocr-shared
vbvr_reward_device: cpu
vbvr_reward_fps: 16
vbvr_reward_decode_batch_size: 8
# Retain at most two decoded rollout batches per rank in normal mode. Delayed
# replay automatically raises this to one complete local rollout step (32 jobs
# at world size 32, still 16 at world size 64) to avoid submit backpressure.
# An 81-frame RGB sample is about 15 MiB.
vbvr_reward_max_pending_jobs: 16
# Keep the per-rank native-thread budget at 16 while scoring two samples in parallel.
vbvr_reward_cpu_workers: 2
vbvr_reward_cpu_threads_per_worker: 8
vbvr_reward_use_process_pool: true
# Keep all 81 frames, resize the videos supplied to the RL reward scorer to
# 1024x1024, and keep an exact 16 FPS output. At 16 FPS, 81 encoded frames
# have a container duration of 5.0625 seconds; this limit prevents the shared
# preparation helper from automatically raising the output rate to 17 FPS.
vbvr_reward_prepared_width: 1024
vbvr_reward_prepared_height: 1024
vbvr_reward_max_duration_seconds: 5.0625
vbvr_reward_prepare_crf: 12
# Temporary EvalKit 6fedd9d9 continuity fallback: G-16 can fail when its
# margin-offset grid hides an adjacent red endpoint. Map scorer errors to the
# configured zero score until the evaluator regression is fixed.
vbvr_reward_fail_on_error: false
vbvr_reward_task_specific_only: true
# Reward videos are disposable and metadata-heavy; keep them on node-local
# temporary storage instead of a shared project filesystem.
vbvr_reward_tmp_dir: /tmp/wan-trainer/vbvr_pro_5b_81f_rule_reward_cps0p7_from_diffsynth_step35500_manifest_rl_evalkit_6fedd9d9_reward1024_fps16
vbvr_reward_keep_tmp: false
vbvr_reward_unsupported_score: 0.0

wandb_project: wan-dancegrpo-vbvr-pro-5b
wandb_run_name: dancegrpo_vbvr_pro_5b_256x256x81_rule_cps0p7_from_diffsynth_step35500_bs32_lr_1e-6_manifest_rl_evalkit_6fedd9d9_reward1024_fps16
