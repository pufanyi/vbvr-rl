trainer: dancegrpo
# Single-GPU environment and data-path smoke derived from the production
# manifest-RL config. This deliberately initializes from the official base
# instead of the unavailable merged DiffSynth step-35500 checkpoint.
model_path: storage/models/Wan2.2-TI2V-5B-Diffusers

# Generate this ignored local fixture with:
# .venv/bin/python scripts/dev/create_i2v_smoke_dataset.py \
#   --output-dir storage/smoke/i2v_512x512x81 \
#   --samples 4 --frames 81 --height 512 --width 512 --fps 16
dataset_json: storage/smoke/i2v_512x512x81/dataset.json
dataset_size: 4
num_frames: 81
height: 512
width: 512
fps: 16

output_dir: storage/checkpoints/dancegrpo_vbvr_pro_5b_512x512x81_official_base_smoke_1gpu
resume_from: null
reset_dataloader: true
auto_resume: false

rl_train_node_count: 0
rl_train_rank_count: 0
rl_actor_weight_sync: none
rl_async_rollout: false

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 1
max_steps: 1
learning_rate: 1.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 0
save_steps: 0
save_final_checkpoint: false
save_epoch_checkpoints: false
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: bfloat16
gradient_checkpointing: true

num_workers: 0
prefetch_factor: 2
persistent_workers: false

# The production config is full-FT HSDP across 64 GPUs. LoRA keeps this
# one-H800 smoke bounded while still executing rollout, reward, replay,
# backward, gradient clipping, and a real optimizer update at 512x512x81.
fsdp: false
expert_parallel: false
hsdp: false
train_experts: both
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.0

# Preserve the target config's shared-prompt and Flow-CPS code paths, scaled
# to one prompt and the minimum valid DanceGRPO group/sampling sizes.
grpo_shared_prompt_batch: true
grpo_shared_prompt_microbatch_size: 1
grpo_delayed_replay: false
grpo_group_size: 2
grpo_sample_batch_size: 2
grpo_train_sample_batch_size: 1
grpo_offload_inference_models: true
grpo_num_sampling_steps: 2
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0.0
# Fake generic samples have no VBVR task metadata or EvalKit checkout. The
# model-internal reward still exercises an additional policy forward without
# pretending to validate the production vbvr_rule scorer objective.
grpo_reward_fn: neg_loss
grpo_sde_formula: flowcps
grpo_sde_noise_scale: 0.7
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 1.0

wandb_project: null
wandb_run_name: null
