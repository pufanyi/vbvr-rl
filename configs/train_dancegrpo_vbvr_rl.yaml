trainer: dancegrpo
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers

# Precomputed VBVR RL split: each sample already has T5 prompt_embeds,
# VAE video latents, and I2V condition latents.
latent_webdataset_dir: data/vbvr/latents/splits/rl
dataset_size: 200000
num_workers: 4
persistent_workers: true
prefetch_factor: 2

output_dir: storage/checkpoints/dancegrpo_vbvr_rl
resume_from: storage/checkpoints/sft_vbvr_fixed_5e-6/checkpoint-2000
reset_dataloader: true

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 2
learning_rate: 1.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
save_steps: 500
log_steps: 1
seed: 42

expert_parallel: false
train_experts: both
lora_rank: 32

# DanceGRPO
grpo_group_size: 16
grpo_sample_batch_size: 8
grpo_num_sampling_steps: 10
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0.0
grpo_reward_fn: neg_loss
grpo_sde_noise_scale: 0.3
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

wandb_project: wan-dancegrpo-vbvr
wandb_run_name: dancegrpo_vbvr_rl
