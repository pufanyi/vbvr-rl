trainer: cos
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers
latent_webdataset_dir: data/maze/latents/maze_384x384x81_perfect_v2/webdataset/sft
dataset_size: 80000
output_dir: storage/checkpoints/cos_maze_perfect_v2_sft_1epoch

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 1
learning_rate: 1.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 500
save_steps: 4000
log_steps: 10
seed: 42

# Zero-boundary COS path for the single-target SFT latent split.
cos_tau_sigma: []
cos_boundary_noise_std: 0.0
cos_path_type: target_cosine

ema_decay: 0.999
prompt_dropout: 0.1
transformer_load_dtype: float32

expert_parallel: true
expert_parallel_data_mode: duplicate
train_experts: both

wandb_project: wan-cos-maze
wandb_run_name: cos_maze_perfect_v2_sft_1epoch
