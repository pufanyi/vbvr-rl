trainer: dancegrpo
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers

latent_webdataset_dir: data/vbvr/latents/splits/rl
dataset_size: 200000
num_workers: 4
persistent_workers: true
prefetch_factor: 2

output_dir: storage/checkpoints/dancegrpo_vbvr_rule_kl
resume_from: storage/checkpoints/sft_vbvr_fixed_5e-6/checkpoint-4000
reset_dataloader: true
auto_resume: false

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 2
learning_rate: 1.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
save_steps: 500
log_steps: 1
seed: 42
ema_decay: 0.9999

expert_parallel: false
train_experts: both
lora_rank: 32

# DanceGRPO
grpo_group_size: 16
grpo_sample_batch_size: 8
grpo_num_sampling_steps: 10
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0.004
grpo_reward_fn: vbvr_rule
grpo_sde_noise_scale: 0.3
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

# VBVR EvalKit rule reward. This decodes generated/GT latents to temporary
# videos and scores with task_specific_only=True, matching run_evaluation.py.
vbvr_reward_evalkit_dir: third_party/VBVR-EvalKit
vbvr_reward_evalkit_source_sha256: f99404482a094931059ddb80b80a7d7d6f700d63bae2d2d15a20d0fd01b37842
vbvr_reward_device: cpu
vbvr_reward_fps: 16
vbvr_reward_decode_batch_size: 1
vbvr_reward_task_specific_only: true
vbvr_reward_tmp_dir: storage/tmp/vbvr_rule_reward
vbvr_reward_keep_tmp: false
vbvr_reward_unsupported_score: 0.0

wandb_project: wan-dancegrpo-vbvr
wandb_run_name: dancegrpo_vbvr_rule_kl
