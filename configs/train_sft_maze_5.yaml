trainer: i2v
model_path: storage/models/dcp_converted/sft_vbvr_fixed_5e-6_checkpoint-6000
latent_webdataset_dir: data/maze/latents/maze_384x384x161_line_v1/webdataset/sft
dataset_size: 80000
output_dir: storage/checkpoints/sft_maze_5

batch_size: 2
gradient_accumulation_steps: 1
num_epochs: 4
learning_rate: 5.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
