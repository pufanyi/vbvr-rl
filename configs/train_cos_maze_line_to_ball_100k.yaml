trainer: cos
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers
latent_webdataset_dir: data/maze/latents/maze_384x384x161_line_to_ball_v1/webdataset/sft
dataset_size: 80000
output_dir: storage/checkpoints/cos_maze_line_to_ball_100k

batch_size: 3
gradient_accumulation_steps: 1
num_epochs: 4
learning_rate: 5.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 500
save_steps: 2000
log_steps: 1
seed: 42

# Chain-of-Step target: latents_0 = path-line waypoint, latents_1 = moving-ball final.
# tau=0.5 gives the line-planning stage roughly half of the denoising path.
cos_tau_sigma: 0.8
cos_boundary_noise_std: 0.02
cos_path_type: target_cosine

ema_decay: 0.0
prompt_dropout: 0.1
transformer_load_dtype: bfloat16

expert_parallel: true
expert_parallel_data_mode: duplicate
train_experts: both

lora_rank: 0

auto_resume: true
num_workers: 8
prefetch_factor: 2
persistent_workers: true

wandb_project: wan-cos-maze
wandb_run_name: cos_maze_line_to_ball_100k
