model_path: storage/models/Wan2.2-I2V-A14B-Diffusers
latent_webdataset_dir: data/vbvr/latents/sft
dataset_size: 1000000
output_dir: storage/checkpoints/correction_vbvr

batch_size: 4
gradient_accumulation_steps: 1
num_epochs: 2
learning_rate: 1.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
save_steps: 2000
log_steps: 1
seed: 42

# EMA is effectively required here — the teacher rollout uses EMA shadow
# weights. A higher decay than pure SFT to keep the target stable.
ema_decay: 0

# Expert parallel is forbidden: the teacher rollout keeps a whole batch at
# a single σ per step, so only one MoE expert runs at a time — EP would
# idle half the GPUs. Use HSDP instead if multi-node.
expert_parallel: false
train_experts: both

# ------------------------------------------------------------------
# On-policy correction
# ------------------------------------------------------------------
# λ on the correction term. Start small (0.05–0.1) and tune up.
correction_weight: 0.1

# Teacher rollout: K denoising steps from ε to x̂.
# 2–5 is the useful range. More steps → x̂ closer to real data → weaker
# correction signal but higher teacher quality.
correction_num_teacher_steps: 4

# SDE rollout diversifies x̂ (stochastic endpoint for same ε). Set to false
# to use deterministic ODE, which makes x̂ a pure function of ε.
correction_use_sde: true
correction_sde_sigma_max: 1.0
correction_cfg_scale: 1.0

# σ sampling range for constructing training points x_σ = σ·ε + (1-σ)·x̂.
# Target is (x_σ - x_GT) / σ, so σ → 0 blows up — keep lo ≥ 0.05.
correction_sigma_lo: 0.05
correction_sigma_hi: 0.9

# Amortize rollout cost: only fire the correction branch every N micro-steps.
# λ is internally scaled by N so the expected gradient per step is unchanged.
# N=4 ≈ 1 extra rollout forward per micro-step on average.
correction_every_n_steps: 4

lora_rank: 32

wandb_project: wan-correction-vbvr
