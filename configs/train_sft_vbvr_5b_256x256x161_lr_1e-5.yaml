trainer: i2v
model_path: storage/models/Wan2.2-TI2V-5B-Diffusers
latent_webdataset_dir: storage/latents/vbvr_5b_256x256x161_fullrun/webdataset/sft
dataset_size: 800000
output_dir: storage/checkpoints/sft_vbvr_5b_256x256x161_full_lr_1e-5

batch_size: 24
gradient_accumulation_steps: 1
num_epochs: 5
learning_rate: 1.0e-5
