trainer: dancegrpo
# Local complete Diffusers pipeline with the DiffSynth step-35500 LoRA merged
# into the matching Wan2.2 TI2V-5B base.
model_path: storage/models/diffsynth_converted_5b/wan2.2-TI2V-5B_260715_vbvr_pro_step-35500

# Materialize the already-downloaded public raw snapshot once with:
# .venv/bin/python -m scripts.data.vbvr_pro_unpack_hf \
#   --dataset-root storage/datasets/vbvr-pro-rl-indomain-50k \
#   --output-dir storage/datasets/vbvr-pro-rl-indomain-50k/materialized \
#   --expected-samples 50000 --workers 8
dataset_json: storage/datasets/vbvr-pro-rl-indomain-50k/materialized/dataset.json
dataset_size: 50000
num_frames: 81
height: 384
width: 384
fps: 16

# The restored manifest is task-grouped. Apply a deterministic full-index
# shuffle before batching so tasks never enter training sequentially.
shuffle_raw_indices: true
shuffle_raw_indices_seed: 42

output_dir: storage/checkpoints/dancegrpo_vbvr_pro_5b_384x384x81_rule_cps0p7_from_diffsynth_step35500_bs32_lr_5e-6_manifest_rl_smoke_1node
resume_from: null
reset_dataloader: true
auto_resume: true

# Single-node, all-rank GRPO: all eight GPUs both roll out and train.
rl_train_node_count: 0
rl_train_rank_count: 0
rl_actor_weight_sync: none
rl_actor_weight_sync_interval: 1
rl_async_rollout: false
rl_async_rollout_prefetch_steps: 0
rl_split_debug_logs: false

batch_size: 32
gradient_accumulation_steps: 1
num_epochs: 5
learning_rate: 5.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 5
save_steps: 100
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: float32
gradient_checkpointing: true

num_workers: 2
prefetch_factor: 2
persistent_workers: true

# One node uses plain FSDP across eight H800s. HSDP adds no second replication
# dimension on a single node.
fsdp: true
expert_parallel: false
hsdp: false
train_experts: both
lora_rank: 0
lora_alpha: 32

# batch_size remains 32 global prompts. Four waves of eight prompts fit one
# eight-GPU node; each prompt is owned by one rank and retains all G=32 samples.
grpo_shared_prompt_batch: true
grpo_shared_prompt_microbatch_size: 8
grpo_delayed_replay: true
grpo_delayed_replay_clip_range: 1.0e-2
grpo_group_size: 32
grpo_sample_batch_size: 8
grpo_train_sample_batch_size: 4
# Full-FT FSDP must reduce-scatter every replay backward instead of retaining
# full unsharded gradients across chunks. Offload T5/VAE between phases to
# preserve additional single-node memory headroom.
grpo_fsdp_sync_each_backward: true
grpo_offload_inference_models: true
grpo_num_sampling_steps: 30
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0
grpo_reward_fn: vbvr_rule
grpo_sde_formula: flowcps
grpo_sde_noise_scale: 0.7
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

vbvr_reward_evalkit_dir: storage/evalkits/vbvr-evalkit-interleave-main_v2-6fedd9d9
vbvr_reward_evalkit_source_sha256: eb977da60e95456734063ba018b14d805680179fdf0e3e3b2ba6f603f27a935c
vbvr_reward_easyocr_module_path: storage/evalkits/easyocr-shared
vbvr_reward_device: cpu
vbvr_reward_fps: 16
vbvr_reward_decode_batch_size: 8
vbvr_reward_max_pending_jobs: 16
vbvr_reward_cpu_workers: 2
vbvr_reward_cpu_threads_per_worker: 8
vbvr_reward_use_process_pool: true
vbvr_reward_prepared_width: 1024
vbvr_reward_prepared_height: 1024
vbvr_reward_max_duration_seconds: 5.0625
vbvr_reward_prepare_crf: 12
# EvalKit 6fedd9d9 has a known G-16 metadata-path exception. Preserve the
# production continuity fallback until that exact evaluator regression is fixed.
vbvr_reward_fail_on_error: false
vbvr_reward_task_specific_only: true
vbvr_reward_tmp_dir: /tmp/wan-trainer/vbvr_pro_5b_384x384x81_rule_reward_cps0p7_from_diffsynth_step35500_lr5e-6_manifest_rl_smoke_1node
vbvr_reward_keep_tmp: false
vbvr_reward_unsupported_score: 0.0

wandb_project: wan-dancegrpo-vbvr-pro-5b
wandb_run_name: dancegrpo_vbvr_pro_5b_384x384x81_rule_cps0p7_from_diffsynth_step35500_bs32_lr_5e-6_manifest_rl_smoke_1node
