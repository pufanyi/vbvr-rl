trainer: dancegrpo
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers

# Same 100-task, 500k-sample EvalKit-supported VBVR-Pro raw dataset as the
# corresponding 5B bs32/lr=1e-6 run. Prompt/video/image tensors are encoded
# online because no latent_webdataset_dir is configured.
dataset_json: data/vbvr_pro/vbvr_pro_train_supported_256x256x161.json
dataset_size: 500000
num_frames: 161
height: 256
width: 256
fps: 16

output_dir: storage/checkpoints/dancegrpo_vbvr_pro_a14b_256x256x161_rule_cps_from_sft_diffsynth_mix_260603_bs32_lr_1e-5_lora_r32
resume_from: storage/checkpoints/sft_diffsynth_mix_260603/checkpoint-epoch1
reset_dataloader: true
auto_resume: true

# All-rank GRPO path for grpo_multinode.fish: all 64 GPUs train and roll out.
# The prompt batch is shared globally and each prompt's G samples are sharded
# across ranks, so batch_size=32 means 32 prompts per optimizer step.
rl_train_node_count: 0
rl_train_rank_count: 0
rl_actor_weight_sync: none
rl_actor_weight_sync_interval: 1
rl_async_rollout: false
rl_async_rollout_prefetch_steps: 0
rl_split_debug_logs: false

batch_size: 32
gradient_accumulation_steps: 1
num_epochs: 5
# LoRA only optimizes the rank-32 adapters. Use a conservative 10x increase
# over the full-finetune GRPO LR, with a longer warmup for the noisy rule reward.
learning_rate: 1.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 50
save_steps: 100
log_steps: 1
seed: 42
ema_decay: 0.0
# LoRA keeps the frozen A14B high/low bases in bf16; the supplied full SFT DCP
# is remapped into the LoRA-wrapped base layers during weight-only init.
transformer_load_dtype: bfloat16
gradient_checkpointing: true

num_workers: 2
prefetch_factor: 2
persistent_workers: true

# DanceGRPO does not support expert parallel. HSDP shards both A14B experts
# over the 8 local GPUs and replicates those shards across the 8 nodes.
fsdp: true
expert_parallel: false
hsdp: true
train_experts: both
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.0

# Shared-prompt all-rank GRPO: with 64 GPUs and batch_size=32, each prompt gets
# 2 ranks; G=32 gives 16 rollouts per rank.
grpo_shared_prompt_batch: true
grpo_group_size: 32
# A14B has much larger per-forward activations than 5B. These knobs only split
# each rank's 16 assigned rollouts/replays into smaller micro-batches; they do
# not change the 32-prompt global batch or G=32 group semantics.
grpo_sample_batch_size: 2
grpo_train_sample_batch_size: 1
grpo_num_sampling_steps: 30
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0
grpo_reward_fn: vbvr_rule
# Coefficients-Preserving Sampling (CPS) SDE transition formula.
grpo_sde_formula: flowcps
grpo_sde_noise_scale: 0.7
# Sample one coefficient per prompt/GRPO group; all G rollouts in that group
# share the sampled value and replay uses the value stored with the rollout.
grpo_cps_noise_scale_range: [0.0, 1.0]
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

# VBVR-Pro interleave EvalKit rule reward. Raw dataset metadata passes the
# original GT first/final/video paths through to the scorer.
vbvr_reward_evalkit_dir: /mnt/umm/users/pufanyi/workspace/Wan-Trainer/storage/evalkits/vbvr-evalkit-interleave-main_v2
vbvr_reward_evalkit_source_sha256: f99edd06fd39b5025a0a46871fc7280f7353d47e8de45b627a0b0711318fd258
vbvr_reward_easyocr_module_path: /mnt/umm/users/pufanyi/workspace/Wan-Trainer/storage/evalkits/easyocr-shared
vbvr_reward_device: cpu
vbvr_reward_fps: 16
vbvr_reward_decode_batch_size: 8
vbvr_reward_cpu_workers: 1
vbvr_reward_cpu_threads_per_worker: 16
vbvr_reward_use_process_pool: true
vbvr_reward_prepared_width: 1024
vbvr_reward_prepared_height: 1024
vbvr_reward_max_duration_seconds: 5.0
vbvr_reward_prepare_crf: 12
vbvr_reward_fail_on_error: true
vbvr_reward_task_specific_only: true
vbvr_reward_tmp_dir: storage/tmp/vbvr_pro_a14b_rule_reward
vbvr_reward_keep_tmp: false
vbvr_reward_unsupported_score: 0.0

wandb_project: wan-dancegrpo-vbvr-pro-a14b
wandb_run_name: dancegrpo_vbvr_pro_a14b_256x256x161_rule_cps_from_sft_diffsynth_mix_260603_bs32_lr_1e-5_lora_r32
