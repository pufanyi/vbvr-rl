trainer: i2v
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers
latent_webdataset_dir: data/maze/latents/maze_384x384x161_line_v1/webdataset/sft
dataset_size: 80000
output_dir: storage/checkpoints/sft_maze_line_100k_24h_full

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 10
learning_rate: 5.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 500
save_steps: 500
log_steps: 10
seed: 42

ema_decay: 0.0
prompt_dropout: 0.1
transformer_load_dtype: bfloat16

expert_parallel: true
expert_parallel_data_mode: duplicate
train_experts: both

lora_rank: 0

auto_resume: true
num_workers: 8
prefetch_factor: 2
persistent_workers: true
