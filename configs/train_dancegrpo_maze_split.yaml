trainer: dancegrpo
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers

# Maze RL latent WebDataset split.
latent_webdataset_dir: data/maze/latents/maze_384x384x161_line_v1/webdataset/rl
dataset_size: 20000

output_dir: storage/checkpoints/dancegrpo_maze_split
resume_from: storage/checkpoints/cos_maze_line_to_ball_100k_0.8_from_vbvr/checkpoint-epoch0
reset_dataloader: true
auto_resume: true

# Split RL: first 2 nodes train, all remaining nodes run rollout/reward actors.
# Four nodes => 2 training nodes : 2 inference nodes.
# Eight nodes => 2 training nodes : 6 inference nodes.
rl_train_node_count: 2
rl_actor_weight_sync: lora
rl_async_rollout: true
rl_async_rollout_prefetch_steps: 0
rl_split_debug_logs: true

# In split mode every train/rollout rank reads the same prompt batch and the
# rollout ranks partition grpo_group_size across cards.
batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 2
learning_rate: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
save_steps: 200
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: bfloat16

num_workers: 1
prefetch_factor: 2
persistent_workers: true

expert_parallel: false
fsdp: true
hsdp: true
train_experts: both
lora_rank: 32
lora_alpha: 32

# DanceGRPO rollout/replay.
grpo_group_size: 10
grpo_sample_batch_size: 1
grpo_train_sample_batch_size: 2
grpo_num_sampling_steps: 32
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0.004
grpo_reward_fn: maze_tracker
grpo_sde_noise_scale: 0.3
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.2

# Eval-matching tracker reward.
maze_tracker_reward_num_frames: 21
maze_tracker_reward_search_radius: 96
maze_tracker_reward_color_slack: 28.0
maze_tracker_reward_goal_tolerance_cells: 1.0
maze_tracker_reward_max_mean_error_cells: 4.0
maze_tracker_reward_w_traj: 0.35
maze_tracker_reward_w_onpath: 0.25
maze_tracker_reward_w_goal: 0.25
maze_tracker_reward_w_progress: 0.15

wandb_project: wan-dancegrpo-maze-split
