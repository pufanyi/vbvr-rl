trainer: dancegrpo
model_path: storage/models/Wan2.2-TI2V-5B-Diffusers

# Latents generated with the 5B TI2V expand-timestep condition format.
latent_webdataset_dir: storage/latents/maze_5b_line_to_ball_v1/webdataset/rl
dataset_size: 20000

output_dir: storage/checkpoints/dancegrpo_maze_5b_line_to_ball_rl_mse_shared_prompt
resume_from: storage/checkpoints/cos_maze_5b_line_to_ball_100k_tau_0.9/checkpoint-epoch4
reset_dataloader: true
auto_resume: true

# All-rank GRPO path for grpo_multinode.fish: every GPU trains and rolls out.
# The prompt batch is shared globally and each prompt's G samples are sharded
# across ranks, so batch_size=8 means 8 prompts per optimizer step on 64 GPUs.
rl_train_node_count: 0
rl_train_rank_count: 0
rl_actor_weight_sync: none
rl_actor_weight_sync_interval: 1
rl_async_rollout: false
rl_async_rollout_prefetch_steps: 0
rl_split_debug_logs: false

batch_size: 8
gradient_accumulation_steps: 1
num_epochs: 5
learning_rate: 1.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
save_steps: 500
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: float32
gradient_checkpointing: true

num_workers: 1
prefetch_factor: 2
persistent_workers: true

# 5B TI2V is a dense single-transformer model; shard with FSDP/HSDP, no expert parallel.
fsdp: true
expert_parallel: false
hsdp: true
train_experts: both
lora_rank: 0
lora_alpha: 32

# Shared-prompt all-rank GRPO: with 64 GPUs and batch_size=8, each prompt gets
# 8 ranks; G=24 gives 3 rollouts per rank.
grpo_shared_prompt_batch: true
grpo_group_size: 24
grpo_sample_batch_size: 4
grpo_train_sample_batch_size: 4
grpo_num_sampling_steps: 30
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0.004
grpo_reward_fn: neg_loss
grpo_sde_noise_scale: 0.3
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

maze_tracker_reward_num_frames: 21
maze_tracker_reward_search_radius: 96
maze_tracker_reward_color_slack: 28.0
maze_tracker_reward_goal_tolerance_cells: 1.0
maze_tracker_reward_max_mean_error_cells: 4.0
maze_tracker_reward_w_traj: 0.35
maze_tracker_reward_w_onpath: 0.25
maze_tracker_reward_w_goal: 0.25
maze_tracker_reward_w_progress: 0.15

wandb_project: wan-dancegrpo-maze-5b-tracker
wandb_run_name: dancegrpo_maze_5b_line_to_ball_rl_mse_shared_prompt
