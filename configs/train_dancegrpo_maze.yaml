trainer: dancegrpo
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers

# Precomputed maze latents (produced by scripts/precompute/maze_webdataset.fish).
# Same contract as VBVRLatentDataset — each sample's safetensors carries
# prompt_embeds / latents / condition plus maze_* tensors the reward reads.
latent_webdataset_dir: data/maze_synth/latents/webdataset
dataset_size: 20000  # match --num_samples passed to gen_maze_webdataset.fish

output_dir: storage/checkpoints/dancegrpo_maze_synth
resume_from: storage/checkpoints/cos_maze_cos_path_all_bfs_3steps/checkpoint-epoch0

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 2
learning_rate: 1.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
save_steps: 200
log_steps: 1
seed: 42

expert_parallel: false
train_experts: both
lora_rank: 32

# DanceGRPO
grpo_group_size: 16
grpo_sample_batch_size: 8
grpo_num_sampling_steps: 10
grpo_clip_range: 1.0e-3
grpo_kl_coeff: 0.0
grpo_reward_fn: maze
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.5

# Maze V1 reward knobs (see src/trainer/rewards/maze.py).
# Raw reward = w_traj·r_traj + w_onpath·r_onpath + w_goal·r_goal,
# z-scored within each group by GRPO — scale matters less than ratios.
maze_reward_num_frames: 6      # number of decoded frames to score per rollout
maze_reward_w_traj: 1.0        # -mean pixel-distance to expected trajectory
maze_reward_w_onpath: 0.5      # fraction of frames where ball is on a passage cell
maze_reward_w_goal: 1.0        # 1 if end-frame ball is within goal_cells of the goal
maze_reward_goal_cells: 0.75

wandb_project: wan-dancegrpo-maze
