trainer: dancegrpo
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers

# RL split generated next to configs/train_sft_maze_4.yaml's SFT split.
latent_webdataset_dir: data/maze/latents/maze_384x384x161_line_v1/webdataset/rl
dataset_size: 20000

output_dir: storage/checkpoints/dancegrpo_maze_4_rl
resume_from: storage/checkpoints/sft_maze_4/checkpoint-epoch0
reset_dataloader: true
auto_resume: true

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 2
learning_rate: 5.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
save_steps: 200
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: bfloat16

# 64 GPUs would otherwise spawn 64 * num_workers loader processes. The RL step
# is dominated by rollout/reward compute, so keep loader fan-out small to avoid
# CPU/filesystem contention without changing the GRPO objective.
num_workers: 1
prefetch_factor: 2
persistent_workers: true

# DanceGRPO currently uses the standard single-group FSDP/HSDP path.
expert_parallel: false
hsdp: true
train_experts: both
lora_rank: 32
lora_alpha: 32

# DanceGRPO. Start conservative; increase group_size to 16 after reward logs look sane.
grpo_group_size: 16
grpo_sample_batch_size: 1
grpo_num_sampling_steps: 8
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0.004
grpo_reward_fn: maze_tracker
grpo_sde_noise_scale: 0.3
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

# Eval-matching tracker reward. Mirrors src.eval.maze_tracker_score overall:
# 0.35*traj + 0.25*on_path + 0.25*goal + 0.15*progress.
maze_tracker_reward_num_frames: 21
maze_tracker_reward_search_radius: 96
maze_tracker_reward_color_slack: 28.0
maze_tracker_reward_goal_tolerance_cells: 1.0
maze_tracker_reward_max_mean_error_cells: 4.0
maze_tracker_reward_w_traj: 0.35
maze_tracker_reward_w_onpath: 0.25
maze_tracker_reward_w_goal: 0.25
maze_tracker_reward_w_progress: 0.15

wandb_project: wan-dancegrpo-maze-tracker
