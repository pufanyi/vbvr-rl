trainer: dancegrpo
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers

# RL split generated next to configs/train_sft_maze_4.yaml's SFT split.
latent_webdataset_dir: data/maze/latents/maze_384x384x161_line_v1/webdataset/rl
dataset_size: 20000

output_dir: storage/checkpoints/dancegrpo_maze_4_rl
resume_from: storage/checkpoints/sft_maze_4/checkpoint-epoch0
reset_dataloader: true
auto_resume: true

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 2
learning_rate: 1.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
save_steps: 200
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: bfloat16

num_workers: 8
prefetch_factor: 2
persistent_workers: true

# DanceGRPO currently uses the standard single-group FSDP/HSDP path.
expert_parallel: false
hsdp: true
train_experts: both
lora_rank: 32
lora_alpha: 32

# DanceGRPO. Start conservative; increase group_size to 16 after reward logs look sane.
grpo_group_size: 8
grpo_sample_batch_size: 2
grpo_num_sampling_steps: 8
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0.004
grpo_reward_fn: maze_line
grpo_sde_noise_scale: 0.3
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

# Growing-path-line reward:
# soft F1 between generated and GT colored line masks, plus goal reach.
maze_line_reward_num_frames: 4
maze_line_reward_color_threshold: 90.0
maze_line_reward_color_temperature: 12.0
maze_line_reward_w_mask: 1.0
maze_line_reward_w_goal: 0.5
maze_line_reward_goal_cells: 1.0

wandb_project: wan-dancegrpo-maze-line
