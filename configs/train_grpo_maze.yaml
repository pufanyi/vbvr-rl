trainer: dancegrpo
model_path: storage/models/Wan2.2-I2V-A14B-Diffusers
dataset_json: data/train_maze_bfs_sft.json
output_dir: storage/checkpoints/dancegrpo_maze_bfs
resume_from: storage/checkpoints/sft_maze_bfs_3steps/checkpoint-epoch0

num_frames: 81
height: 256
width: 256
fps: 16

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 2
learning_rate: 1.0e-5
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
save_steps: 1000
log_steps: 1
seed: 42

ema_decay: 0.99

expert_parallel: false
train_experts: both
lora_rank: 32

# DanceGRPO
grpo_group_size: 16
grpo_sample_batch_size: 1
grpo_num_sampling_steps: 10
grpo_clip_range: 1.0e-3
grpo_kl_coeff: 0.004
grpo_reward_fn: neg_loss
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

wandb_project: wan-dancegrpo-maze
