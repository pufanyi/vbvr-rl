trainer: dancegrpo
# Co-hosting feasibility smoke for scripts/train/grpo_vlm_eval_multinode.fish.
# Eight training ranks share their visible devices with one TP8 Qwen3.6-27B
# vLLM service. G=8 gives one rollout per rank for a single shared prompt;
# T=8 and max_steps=3 intentionally bound the first end-to-end validation
# while retaining enough denoising steps for a VLM to distinguish outcomes.
model_path: storage/models/diffsynth_converted_5b/wan2.2-TI2V-5B_260715_vbvr_pro_step-35500

dataset_json: storage/datasets/vbvr-pro-rl-indomain-50k/materialized/dataset.json
dataset_size: 50000
num_frames: 81
height: 384
width: 384
fps: 16
shuffle_raw_indices: true
shuffle_raw_indices_seed: 42

output_dir: storage/host_vllm/runs/dancegrpo_vbvr_pro_5b_384x384x81_vlm_qwen36_task_prompts_strict_smoke_1node_3step
resume_from: null
reset_dataloader: true
auto_resume: false

rl_train_node_count: 0
rl_train_rank_count: 0
rl_actor_weight_sync: none
rl_async_rollout: false

batch_size: 1
gradient_accumulation_steps: 1
num_epochs: 5
max_steps: 3
learning_rate: 1.0e-6
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 0
save_steps: 0
save_epoch_checkpoints: false
save_final_checkpoint: false
log_steps: 1
seed: 42
ema_decay: 0.0
transformer_load_dtype: float32
gradient_checkpointing: true

num_workers: 2
prefetch_factor: 2
persistent_workers: true

fsdp: true
expert_parallel: false
hsdp: false
train_experts: both
lora_rank: 0

grpo_shared_prompt_batch: true
grpo_shared_prompt_microbatch_size: 1
grpo_delayed_replay: false
grpo_group_size: 8
grpo_sample_batch_size: 1
grpo_train_sample_batch_size: 1
grpo_fsdp_sync_each_backward: true
grpo_offload_inference_models: true
grpo_num_sampling_steps: 8
grpo_clip_range: 1.0e-4
grpo_kl_coeff: 0
grpo_reward_fn: vbvr_vlm
grpo_save_rollout_videos: true
grpo_rollout_video_dir: storage/host_vllm/runs/dancegrpo_vbvr_pro_5b_384x384x81_vlm_qwen36_task_prompts_strict_smoke_1node_3step/rollout_videos
grpo_rollout_video_every_steps: 1
grpo_rollout_video_max_per_rank: 1
grpo_rollout_video_fps: 16
grpo_sde_formula: flowcps
grpo_sde_noise_scale: 0.7
grpo_cfg_scale: 1.0
dancegrpo_share_group_init_noise: true
dancegrpo_timestep_selection_ratio: 0.6

# The launcher overrides base_url/model/key through WAN_TRAINER_VLM_* so the
# same config works on every node with its node-local service.
vlm_reward_base_url: http://127.0.0.1:18080/v1
vlm_reward_model: qwen3.6-27b
vlm_reward_api_key: EMPTY
vlm_reward_prompt_mode: task_specific
vlm_reward_video_fps: 16
vlm_reward_video_num_frames: 32
vlm_reward_include_gt_first_frame: true
vlm_reward_decode_batch_size: 1
vlm_reward_concurrency: 1
vlm_reward_max_pending_jobs: 1
vlm_reward_request_timeout_seconds: 180
vlm_reward_max_retries: 2
vlm_reward_retry_backoff_seconds: 1
vlm_reward_max_new_tokens: 1024
vlm_reward_image_max_edge: 384
vlm_reward_jpeg_quality: 85
vlm_reward_score_max: 100
vlm_reward_use_structured_output: false
vlm_reward_validate_service: true
vlm_reward_fail_on_error: true
vlm_reward_error_score: 0
vlm_reward_log_first_n: 6

wandb_project: null
wandb_run_name: null
